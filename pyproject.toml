[project]
name = "harmonaizer"
version = "2.0.0"
description = "Melody harmonizer: rule-based and learned engines that write the accompanying voices"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["contracts", "ml", "ml.engines"]

[tool.pytest.ini_options]
# rootdir-relative so `pytest` works from anywhere in the repo without sys.path hacks
pythonpath = ["."]
testpaths = ["contracts", "ml", "backend"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
