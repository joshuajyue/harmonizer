server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container so the browser only ever
    # talks to one origin (this nginx server) - no CORS involved.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
